<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08152d" />
    <title>Strategy Galalaxy</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        background: #050b18;
      }

      * { box-sizing: border-box; }

      html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; }

      body {
        background: radial-gradient(circle at 50% 20%, #183664 0%, #08152d 45%, #050b18 100%);
        color: #eaf5ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior: none;
        touch-action: none;
      }

      #game-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <main id="game-shell" aria-label="Strategy Galalaxy">
      <canvas id="game-canvas" tabindex="0" aria-label="Strategy Galalaxy Spielfläche"></canvas>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
